name: Deploy Apps Script

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
  workflow_dispatch:
    inputs:
      descricao:
        description: "Descrição da versão (opcional)"
        required: false

concurrency:
  group: deploy-apps-script
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validar código
        run: |
          test -f src/appsscript.json || { echo "::error::src/appsscript.json não encontrado. Rode o workflow 'Importar do Apps Script' primeiro."; exit 1; }
          ls src/*.html >/dev/null 2>&1 || { echo "::error::Nenhum arquivo HTML em src/ — o push apagaria PainelHTML e ManualHTML do Apps Script."; exit 1; }
          for f in src/*.js; do node --check "$f"; done

      - name: Testes automatizados
        run: for t in tests/*.test.js; do [ -f "$t" ] || continue; echo "▶ $t"; node "$t"; done

      - name: Configurar clasp
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
          SCRIPT_ID: ${{ secrets.SCRIPT_ID }}
        run: ./scripts/setup-clasp.sh

      - name: Enviar código (clasp push)
        run: |
          set -o pipefail
          clasp push --force 2>&1 | tee /tmp/push.log
          echo "::notice title=Saida do clasp push::$(tr '\n' ' ' < /tmp/push.log | cut -c1-900)"
          if grep -qiE "error|erro|failed|syntax" /tmp/push.log; then exit 1; fi

      - name: Conferir código publicado
        run: |
          mkdir -p /tmp/remoto
          jq '.rootDir="/tmp/remoto"' .clasp.json > /tmp/c.json
          cp .clasp.json /tmp/clasp.bak && cp /tmp/c.json .clasp.json
          clasp pull
          cp /tmp/clasp.bak .clasp.json
          if diff -rq src /tmp/remoto; then
            echo "::notice title=Verificado::Código no Apps Script idêntico ao repositório"
          else
            echo "::error title=Divergência::O Apps Script não ficou igual ao repositório: $(diff -rq src /tmp/remoto | tr '\n' ' ')"
            exit 1
          fi

      # O MVT é um script da planilha: menu e gatilhos usam o código recém-enviado (HEAD).
      # A implantação versionada é opcional e não bloqueia o deploy.
      - name: Atualizar implantação (opcional)
        continue-on-error: true
        env:
          DEPLOYMENT_ID: ${{ secrets.DEPLOYMENT_ID }}
          DESC: ${{ github.event.inputs.descricao }}
        run: |
          [ -n "$DEPLOYMENT_ID" ] || { echo "Sem DEPLOYMENT_ID; etapa ignorada."; exit 0; }
          MSG="${DESC:-$(git log -1 --pretty=%s | cut -c1-90)} (${GITHUB_SHA::7})"
          if [ "$CLASP_MAJOR" = "3" ]; then
            clasp create-deployment --deploymentId "$DEPLOYMENT_ID" --description "$MSG" \
              || clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "$MSG"
          else
            clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "$MSG"
          fi

      - name: Resumo
        run: |
          echo "### ✅ Deploy concluído" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: \`${GITHUB_SHA::7}\` — $(git log -1 --pretty=%s)" >> "$GITHUB_STEP_SUMMARY"
